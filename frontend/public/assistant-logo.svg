<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Lamer Konekte assistant">
  <!--
    The assistant mark: the project's circuit-fish, set on the same navy rounded
    square as /icon.svg.

    The badge is not decoration. The mark itself is navy-on-transparent, which
    disappears against the Night theme and greys out against Sunlight's pure
    white. Carrying its own background means one asset renders correctly in all
    three themes without a per-theme variant.

    To swap in a different export of the logo, replace the contents of the
    <g id="mark"> group and leave the badge alone.
  -->
  <defs>
    <linearGradient id="lk-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E6F9E"/>
      <stop offset="1" stop-color="#123C63"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="#0B2545"/>

  <g id="mark" transform="translate(10 22)">
    <!-- dorsal fin -->
    <path d="M62 30 L74 2 L82 34 Z" fill="#1E5E8C"/>
    <!-- tail -->
    <path d="M92 42 L114 24 L108 44 L114 66 L92 52 Z" fill="#1E5E8C"/>
    <!-- body -->
    <ellipse cx="56" cy="46" rx="42" ry="28" fill="url(#lk-body)"/>
    <!-- belly fin -->
    <path d="M46 58 Q62 78 90 62 Q68 68 52 52 Z" fill="#DCEEF8"/>
    <!-- lower fin -->
    <path d="M30 66 Q34 80 44 78 Q36 72 34 62 Z" fill="#1E5E8C"/>
    <!-- eye ring, open on the right so it reads as an eye and not a bubble -->
    <path d="M40 30 A17 17 0 1 0 40 62 A13 13 0 1 1 40 30 Z" fill="#FFFFFF"/>
    <circle cx="36" cy="42" r="5" fill="#FFFFFF"/>
    <!-- circuit trace: the "konekte" half of the name -->
    <g fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round">
      <path d="M52 40 H62 L70 32 H76"/>
      <path d="M62 40 H72 L78 44 H84"/>
      <path d="M58 48 H70 L76 56 H82"/>
    </g>
    <g fill="#0B2545" stroke="#FFFFFF" stroke-width="3.2">
      <circle cx="80" cy="32" r="4.2"/>
      <circle cx="88" cy="44" r="4.2"/>
      <circle cx="86" cy="56" r="4.2"/>
    </g>
  </g>
</svg>
