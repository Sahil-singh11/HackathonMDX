[pytest]
# The default suite is offline: live tests are deselected here and an autouse
# socket guard in conftest.py blocks external connections for everything not
# marked `live`. Run the live tier explicitly, with the key exported:
#
#   GEMINI_API_KEY=... .venv/bin/python -m pytest -m live -v          (WSL/Linux)
#   $env:GEMINI_API_KEY='...'; .venv\Scripts\python -m pytest -m live  (Windows)
#
addopts = -m "not live"
markers =
    live: makes real hosted-API calls and spends quota; excluded from the default suite
